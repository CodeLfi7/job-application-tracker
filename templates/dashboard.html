<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Job Application Tracker - Dashboard</title>
    <!-- Optional: Bootstrap CDN for clean styling -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container mt-5">
        <h1 class="mb-4">Job Application Tracker</h1>

        <div class="row">
            <div class="col-md-4">
                <div class="card text-white bg-primary mb-3">
                    <div class="card-header">Total Applications</div>
                    <div class="card-body">
                        <h2 class="card-title">{{ stats.count if stats else 0 }}</h2>
                        <p class="card-text">Active applications tracked in the system.</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="mt-4">
            <a href="/companies" class="btn btn-primary">Manage Companies</a>
            <a href="/jobs" class="btn btn-secondary">Manage Jobs</a>
            <a href="/applications" class="btn btn-secondary">Manage Applications</a>
            <a href="/search_jobs" class="btn btn-info text-white">Job Match / Search</a>
        </div>
    </div>
</body>
</html>
